syntax = "proto3";
package twigrpc;

message RpcResponse {
  bytes payload = 1;
  string error_detail = 2;
}

message Instance {
  string service = 1;
  string instance_id = 2;
  string ip = 3;
  uint32 port = 4;
  bool healthy = 5;
}

message DiscoverRequest {
  string service = 1;
}

message DiscoverResponse {
  repeated Instance instances = 1;
  uint64 version = 2;
}

message HeartbeatRequest {
  string instance_id = 1;
}

message HeartbeatResponse {
  bool ok = 1;
}
