version: "3.8"

# 镜像由 compose 自动构建（context 为仓库根，Dockerfile 在 deploy/）。
# 一键起栈：cd deploy && docker compose up -d
x-twigrpc-build: &twigrpc-build
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: twigrpc:latest

services:
  registry:
    <<: *twigrpc-build
    command: ["/app/registryd/registryd", "8500"]
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8500'"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [twigrpc]

  server1:
    <<: *twigrpc-build
    hostname: server1
    command: ["/app/examples/math_server", "9000", "--registry", "registry:8500", "--admin", "9100"]
    ports:
      - "9001:9000"
      - "9101:9100"
    depends_on:
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [twigrpc]

  server2:
    <<: *twigrpc-build
    hostname: server2
    command: ["/app/examples/math_server", "9000", "--registry", "registry:8500", "--admin", "9100"]
    ports:
      - "9002:9000"
      - "9102:9100"
    depends_on:
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [twigrpc]

  server3:
    <<: *twigrpc-build
    hostname: server3
    command: ["/app/examples/math_server", "9000", "--registry", "registry:8500", "--admin", "9100"]
    ports:
      - "9003:9000"
      - "9103:9100"
    depends_on:
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [twigrpc]

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      server1:
        condition: service_healthy
      server2:
        condition: service_healthy
      server3:
        condition: service_healthy
    networks: [twigrpc]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
      server1:
        condition: service_healthy
      server2:
        condition: service_healthy
      server3:
        condition: service_healthy
    networks: [twigrpc]

networks:
  twigrpc:
    driver: bridge
